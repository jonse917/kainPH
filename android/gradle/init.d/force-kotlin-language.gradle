allprojects {
  // Ensure Kotlin compilation uses a supported language version and JVM target.
  // This helps Kotlin compiler >=2.x accept older build scripts that didn't set languageVersion explicitly.
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinCompile ->
    kotlinCompile.kotlinOptions {
      // Keep JVM target compatible with Android toolchain
      jvmTarget = "1.8"
      // Require Kotlin language 1.8 (>=1.8). Kotlin 1.4 is no longer supported by Kotlin >=2.x
      languageVersion = "1.8"
      apiVersion = "1.8"
    }
  }
}
